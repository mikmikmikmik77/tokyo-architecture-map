<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>도쿄 건축 투어 (밐's Pick)</title>
  <meta name="description" content="도쿄 건축물 38곳을 걸어서 둘러보는 투어 지도">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>도쿄 건축 투어 <span>(밐's Pick)</span></h1>
    <p class="progress" id="progress" aria-live="polite"></p>
  </header>

  <nav class="tabs" id="tabs" aria-label="권역 선택"></nav>

  <div class="banner" id="offline-banner" hidden>
    오프라인이에요. 목록과 체크 기록은 그대로 쓸 수 있어요. 지도와 스트리트뷰는 연결되면 다시 열려요.
  </div>

  <div class="stage">
    <!-- 목록 화면 -->
    <main class="list" id="list" tabindex="-1">
      <p class="sort-note" id="sort-note" hidden></p>
      <div id="cards"></div>
      <div class="empty" id="empty" hidden>
        <p id="empty-text"></p>
        <button type="button" class="btn ghost" id="clear-filters">필터 풀기</button>
      </div>
    </main>

    <!-- 전체 지도 화면 -->
    <section class="mapview" id="mapview" hidden aria-label="전체 지도">
      <div id="map"></div>
      <div class="map-msg" id="map-msg" hidden>
        <div class="map-msg-box">
          <p class="map-msg-title" id="map-msg-title"></p>
          <p id="map-msg-text"></p>
          <button type="button" class="btn primary" id="map-retry">다시 시도</button>
        </div>
      </div>
      <div class="legend" id="legend" hidden>
        <span><i class="dot todo"></i>안 가본 곳</span>
        <span><i class="dot done"></i>방문 완료</span>
        <span><i class="dot fav"></i>즐겨찾기</span>
        <span><i class="dot me"></i>내 위치</span>
      </div>
      <button type="button" class="fab" id="locate" hidden aria-label="내 위치로 이동">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="currentColor"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="sheet" id="sheet" hidden></div>
    </section>
  </div>

  <!-- 하단 조작 바 (한 손 엄지 위치) -->
  <nav class="dock" aria-label="화면 전환과 필터">
    <button type="button" data-view="list" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
      <span>목록</span>
    </button>
    <button type="button" data-view="map" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-6.1-6.5-11A6.5 6.5 0 0 1 12 3.5 6.5 6.5 0 0 1 18.5 10c0 4.9-6.5 11-6.5 11z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.3" fill="currentColor"/></svg>
      <span>전체 지도</span>
    </button>
    <i class="dock-sep" aria-hidden="true"></i>
    <button type="button" data-toggle="near" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 3.5 3.5 10.6l6.7 2.7 2.7 6.7z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>
      <span>가까운 순</span>
    </button>
    <button type="button" data-toggle="fav" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3.6 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 17l-5.2 2.7 1-5.8L3.5 9.8l5.9-.9z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>
      <span>즐겨찾기만</span>
    </button>
    <button type="button" data-toggle="todo" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-dasharray="3.6 3"/></svg>
      <span>안 가본 곳만</span>
    </button>
  </nav>

  <!-- 스트리트뷰 화면 -->
  <section class="sv" id="sv" hidden aria-label="스트리트뷰">
    <header class="sv-head">
      <div>
        <p class="sv-title" id="sv-title"></p>
        <p class="sv-sub" id="sv-sub"></p>
      </div>
      <button type="button" class="close" id="sv-close" aria-label="스트리트뷰 닫기">✕</button>
    </header>
    <div class="sv-body">
      <div id="pano"></div>
      <div class="map-msg" id="sv-msg" hidden>
        <div class="map-msg-box">
          <p class="map-msg-title" id="sv-msg-title"></p>
          <p id="sv-msg-text"></p>
          <div id="sv-msg-actions"></div>
        </div>
      </div>
    </div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="places.js"></script>
  <script src="app.js"></script>
</body>
</html>
